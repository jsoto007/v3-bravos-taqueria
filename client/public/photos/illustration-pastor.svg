  <g fill="#7A2412">
    <circle cx="170" cy="212" r="5"/><circle cx="228" cy="238" r="5"/>
    <circle cx="163" cy="270" r="6"/><circle cx="242" cy="300" r="6"/>
    <circle cx="182" cy="342" r="6"/><circle cx="220" cy="360" r="5"/>
  </g>
  <g fill="#F0C64F">
    <circle cx="205" cy="208" r="4"/><circle cx="186" cy="240" r="4"/>
    <circle cx="219" cy="274" r="5"/><circle cx="170" cy="306" r="5"/>
    <circle cx="238" cy="336" r="5"/>
  </g>
  <path d="M156 392 q4 14 -3 22 M244 392 q-4 14 3 22" stroke="#2B1B10" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- sparks -->
