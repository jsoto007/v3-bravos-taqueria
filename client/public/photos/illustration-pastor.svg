  </g>
  <path d="M186 166 l8 10 M198 164 l8 10 M210 164 l6 9" stroke="#B5872B" stroke-width="4" stroke-linecap="round"/>

  <!-- meat cone: stacked wavy bands -->
  <g stroke="#2B1B10" stroke-width="7" stroke-linejoin="round">
    <path d="M156 196 q44 -14 88 0 l-6 26 q-38 -12 -76 0 Z" fill="#C8401F"/>
    <path d="M148 222 q52 -16 104 0 l-7 30 q-45 -14 -90 0 Z" fill="#A93016"/>
    <path d="M139 252 q61 -18 122 0 l-8 34 q-53 -16 -106 0 Z" fill="#C8401F"/>
    <path d="M129 286 q71 -20 142 0 l-9 38 q-62 -18 -124 0 Z" fill="#A93016"/>
    <path d="M118 324 q82 -22 164 0 l-52 62 q-30 10 -60 0 Z" fill="#C8401F"/>
