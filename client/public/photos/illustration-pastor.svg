<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Tacos al pastor illustration">
  <rect width="400" height="500" fill="#F7EAD3"/>
  <circle cx="200" cy="245" r="150" fill="#E9B44C"/>
  <circle cx="200" cy="245" r="150" fill="none" stroke="#2B1B10" stroke-width="7"/>
  <ellipse cx="200" cy="425" rx="112" ry="16" fill="#2B1B10" opacity="0.12"/>

  <!-- spit rod -->
  <line x1="200" y1="112" x2="200" y2="408" stroke="#2B1B10" stroke-width="13" stroke-linecap="round"/>
  <line x1="200" y1="118" x2="200" y2="404" stroke="#8A8A8A" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="108" r="11" fill="#6E2B21" stroke="#2B1B10" stroke-width="6"/>

  <!-- pineapple crown -->
  <g stroke="#2B1B10" stroke-width="6" stroke-linejoin="round">
    <path d="M200 128 L184 156 L216 156 Z" fill="#4E7A35"/>
    <path d="M182 140 L164 162 L200 160 Z" fill="#6FA04C"/>
    <path d="M218 140 L236 162 L200 160 Z" fill="#6FA04C"/>
