<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Fresh salsas illustration">
  <rect width="400" height="500" fill="#F7EAD3"/>
  <circle cx="200" cy="245" r="150" fill="#E9B44C"/>
  <circle cx="200" cy="245" r="150" fill="none" stroke="#2B1B10" stroke-width="7"/>
  <ellipse cx="200" cy="416" rx="126" ry="16" fill="#2B1B10" opacity="0.12"/>

  <!-- molcajete: wide stone bowl with a thick rim and stubby feet -->
  <g stroke="#2B1B10" stroke-width="7" stroke-linejoin="round">
    <path d="M104 296 q0 56 96 56 q96 0 96 -56 l-10 0 q0 44 -86 44 q-86 0 -86 -44 Z" fill="#8A8078"/>
    <path d="M110 296 q0 48 90 48 q90 0 90 -48 Z" fill="#6B6058"/>
    <path d="M146 348 q-6 16 -14 20 M254 348 q6 16 14 20 M200 352 v22" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="200" cy="296" rx="96" ry="26" fill="#5C544E"/>
    <ellipse cx="200" cy="296" rx="76" ry="18" fill="#C8401F"/>
    <!-- tejolote (stone pestle) leaning in the bowl -->
    <path d="M258 240 q26 -22 40 -10 q12 12 -12 32 l-24 4 Z" fill="#8A8078"/>
    <line x1="262" y1="266" x2="240" y2="288" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- stone texture -->
  <g fill="#4A423C">
    <circle cx="150" cy="322" r="4"/><circle cx="186" cy="334" r="4"/>
    <circle cx="236" cy="326" r="4"/><circle cx="128" cy="306" r="3"/>
  </g>
  <circle cx="176" cy="292" r="5" fill="#7A2412"/>
  <circle cx="216" cy="298" r="4" fill="#A93016"/>
  <path d="M156 288 q10 -8 24 -8" stroke="#E06A3C" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- green salsa bowl, left -->
  <g stroke="#2B1B10" stroke-width="6" stroke-linejoin="round">
    <path d="M74 250 h84 q-4 34 -42 34 q-38 0 -42 -34 Z" fill="#FFF6E6"/>
    <ellipse cx="116" cy="250" rx="42" ry="12" fill="#6FA04C"/>
  </g>
  <circle cx="104" cy="248" r="4" fill="#4E7A35"/>

  <!-- chilis + lime around -->
  <g stroke="#2B1B10" stroke-width="6" stroke-linejoin="round">
    <path d="M108 190 q26 -16 44 2 q-22 14 -44 -2 Z" fill="#4E7A35"/>
    <circle cx="322" cy="266" r="15" fill="#D6E3B8"/>
  </g>
  <g stroke="#8FB768" stroke-width="4" stroke-linecap="round">
    <path d="M314 258 l16 16 M314 274 l16 -16 M322 254 v24"/>
  </g>

  <!-- aroma steam -->
  <g stroke="#C8401F" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M176 158 q6 -14 0 -26 M204 164 q6 -14 0 -26 M232 158 q6 -14 0 -26"/>
  </g>
</svg>
