# Netlify configuration — client-only static site.
#
# The app still lives in client/, so `base` points Netlify there; `publish` is
# resolved relative to that base, hence "dist" and not "client/dist".

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. This is a catch-all, so it must stay LAST among redirects —
# Netlify applies the first match. Static files that exist on disk (including
# the per-route index.html files generated by the seoRoutes Vite plugin, and
# sitemap.xml / robots.txt) are served before any redirect rule is consulted,
# so /menu still gets its own pre-baked HTML with the correct meta tags.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames are content-addressed, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate, otherwise a menu or price change can sit stale in
# visitors' browsers long after a deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
